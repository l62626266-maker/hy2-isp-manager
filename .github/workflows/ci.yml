name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - name: Bash syntax
        run: bash -n hy2-manager install.sh tests/*.sh
      - name: ShellCheck
        run: shellcheck -x hy2-manager install.sh tests/*.sh
      - name: Contract tests
        run: bash tests/run.sh
      - name: Pinned Hysteria config smoke test
        run: bash tests/hysteria-config-smoke.sh
      - name: Secret-pattern guard
        run: |
          if grep -RIE --exclude-dir=.git --exclude=ci.yml '(dns_cloudflare_api_token[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,}|hysteria2://[A-Fa-f0-9]{32,}@)' .; then
            echo 'Possible committed credential detected.' >&2
            exit 1
          fi
